name: Quality and data-safety checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Verify no local FAQ data is tracked
        shell: pwsh
        run: ./scripts/check-no-runtime-data.ps1

      - name: Test KnowledgeApp Codex plugin commands
        shell: pwsh
        run: ./scripts/test-codex-plugin.ps1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Run Rust lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build Windows application
        run: npm run tauri build -- --no-bundle

      - name: Verify built files contain no runtime data
        shell: pwsh
        run: |
          ./scripts/check-no-runtime-data.ps1 -ReleaseDirectory ./dist
          ./scripts/check-no-runtime-data.ps1 -ReleaseDirectory ./src-tauri/target/release
