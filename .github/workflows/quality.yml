name: Quality and data-safety checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Verify UTF-8 source encoding
        shell: pwsh
        run: ./scripts/check-text-encoding.ps1

      - name: Verify no local FAQ data is tracked
        shell: pwsh
        run: ./scripts/check-no-runtime-data.ps1

      - name: Test KnowledgeApp Codex plugin commands
        shell: pwsh
        run: ./scripts/test-codex-plugin.ps1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Run Rust lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build Windows NSIS installer
        run: npm run tauri build

      - name: Verify built files contain no runtime data
        shell: pwsh
        run: |
          ./scripts/check-no-runtime-data.ps1 -ReleaseDirectory ./dist
          ./scripts/check-no-runtime-data.ps1 -ReleaseDirectory ./src-tauri/target/release
          ./scripts/check-no-runtime-data.ps1 -ReleaseDirectory ./src-tauri/target/release/bundle
          ./scripts/check-release-bundle-config.ps1 -InstallerDirectory ./src-tauri/target/release/bundle/nsis

      - name: Record NSIS installer SHA-256
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath ./src-tauri/target/release/bundle/nsis -Filter '*.exe' -File |
            Get-FileHash -Algorithm SHA256 |
            Format-Table -AutoSize

      - name: Upload Windows NSIS installer
        uses: actions/upload-artifact@v7
        with:
          name: KnowledgeApp-Windows-NSIS-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/KnowledgeApp_0.3.3_*-setup.exe
          if-no-files-found: error
