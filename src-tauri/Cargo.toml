[package]
name = "web-knowledge-system"
version = "0.3.3"
description = "ローカルで完結する一人用FAQ・ナレッジ管理アプリ"
authors = ["KnowledgeApp contributors"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "web_knowledge_system_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argon2 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
rand_core = { version = "0.6", features = ["getrandom"] }
flate2 = "1"
fs4 = "1.1.0"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2.4.3"
thiserror = "2"
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v7", "serde"] }
walkdir = "2"
zip = { version = "7.2", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tempfile = "3"
